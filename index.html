main{max-width:880px;margin:0 auto;padding:16px 14px 40px}

input[type=checkbox],input[type=radio]{accent-color:var(--p);width:18px;height:18px}
.bad{border-color:var(--err)!important;background:rgba(220,38,38,.07)!important}

button{font:inherit;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;font-weight:700;transition:transform .08s,box-shadow .15s,filter .15s}

.b1{background:linear-gradient(135deg,var(--p),#1d4ed8);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}

.b3{background:linear-gradient(135deg,var(--p2),#0f766e);color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.28)}
.bx{background:rgba(220,38,38,.1);color:var(--err);padding:8px 12px;border-radius:10px}

.steps span.done{background:var(--p2);border-color:var(--p2);color:#fff}.steps span.now{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 0 0 5px var(--ring)}

.msg{padding:12px 14px;border-radius:12px;font-size:13px;margin:12px 0}

</style>

/* ================= FIELD BUILDERS ================= */
function T(label,p,o={}){const t=o.type||'text';return `<label class="f ${o.w||''}"><span>${label}${o.req?' <b>*</b>':''}</span><input type="${t}" data-p="${p}" value="${esc(getp(root(),p))}" placeholder="${esc(o.ph||'')}"></label>`}
function TA(label,p,o={}){return `<label class="f ${o.w||''}"><span>${label}${o.req?' <b>*</b>':''}</span><textarea rows="2" data-p="${p}">${esc(getp(root(),p))}</textarea></label>`}
function SEL(label,p,opts,o={}){return `<label class="f ${o.w||''}"><span>${label}${o.req?' <b>*</b>':''}</span><select data-p="${p}"><option value="">-- select --</option>${opts.map(x=>`<option ${getp(root(),p)===x?'selected':''}>${x}</option>`).join('')}</select></label>`}
function RAD(label,p,opts,o={}){return `<div class="f ${o.w||''}"><span>${label}${o.req?' <b>*</b>':''}</span><div class="rad">${opts.map(([v,t])=>`<label><input type="radio" name="${p}" data-p="${p}" ${o.rr?'data-rr':''} value="${v}" ${getp(root(),p)===v?'checked':''}> ${t}</label>`).join('')}</div></div>`}
function CB(label,p,o={}){return `<label class="f ${o.w||''}" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" data-p="${p}" ${o.rr?'data-rr':''} ${getp(root(),p)?'checked':''}><span style="margin:0;font-weight:400">${label}</span></label>`}
const YN=[['Yes','Yes'],['No','No']];
function SCH(label,p,o={}){const ph='Start typing and pick from the list, or type the full name';return `<label class="f ${o.w||''}"><span>${label} <b>*</b></span><input type="text" list="schl" data-p="${p}" data-sch value="${esc(getp(root(),p))}" placeholder="${ph}"></label>`}
const schoolMatch=v=>CFG.schools.find(x=>x.name.toLowerCase()===String(v||'').trim().toLowerCase());
const schoolOK=v=>true; // schools that are not in the list are allowed: the user types the full name
function fillSchools(){const d=document.getElementById('schl');if(d)d.innerHTML=CFG.schools.map(x=>`<option value="${esc(x.name)}">${esc(x.district)}</option>`).join('')}
async function loadConfig(){if(!API_URL)return;try{const r=await api('config',{});if(r.ok){CFG={settings:r.settings,forms:Array.isArray(r.forms)?r.forms:[],schools:(r.schools&&r.schools.length>3)?r.schools:CFG.schools};fillSchools();const ae=document.activeElement;if(!ae||ae===document.body)render()}}catch(e){}}

const dateOnly=iso=>{if(!iso)return'';const d=new Date(iso);return isNaN(d)?'':MON[d.getMonth()]+' '+String(d.getDate()).padStart(2,'0')+', '+d.getFullYear()};

function processSig(src,cb,scale){
 const img=new Image();img.onload=()=>{
  const MW=360*(scale||1),MH=140*(scale||1);let w=img.width,h=img.height;const sc=Math.min(1,MW/w,MH/h);w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const id=x.getImageData(0,0,w,h),d=id.data;const edge=[];for(let i=0;i<w;i++){edge.push(lum(d,(i)*4),lum(d,((h-1)*w+i)*4))}for(let j=0;j<h;j++){edge.push(lum(d,(j*w)*4),lum(d,(j*w+w-1)*4))}
  edge.sort((a,b)=>a-b);const bg=edge[edge.length>>1]||255,th=Math.min(215,bg*0.78);
  let x0=w,y0=h,x1=0,y1=0;
  for(let p=0;p<w*h;p++){const i=p*4,L=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];if(L>th){d[i+3]=0}else{d[i]=8;d[i+1]=18;d[i+2]=60;d[i+3]=Math.round(255*Math.min(1,(th-L)/(th*0.55)+0.35));const px=p%w,py=(p/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}}
  if(x1<x0){cb(null);return}
  x.clearRect(0,0,w,h);x.putImageData(id,0,0);const pad=4,cx=Math.max(0,x0-pad),cy=Math.max(0,y0-pad),cw=Math.min(w-cx,x1-x0+2*pad),ch=Math.min(h-cy,y1-y0+2*pad);
  const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,cx,cy,cw,ch,0,0,cw,ch);
  const url=o.toDataURL('image/png');if(url.length>38000&&(scale||1)>0.35)processSig(src,cb,(scale||1)*0.7);else cb(url.length>42000?null:url)};
 img.onerror=()=>cb(null);img.src=src}

function schPicker(id,sel){return staff.role==='HRMO'?(CFG.schools.length?`<label class="f"><span>School</span><select id="${id}">${schOpts(sel||'')}</select></label>`:`<label class="f"><span>School (exact name)</span><input type="text" id="${id}"></label>`):`<p class="sub">School: <b>${esc(staff.school)}</b></p><input type="hidden" id="${id}" value="${esc(staff.school)}">`}
function evalPanel(d){const ev=d.eval||{},hasOv=(ev.assign||[]).length>0,base=hasOv?ev.assign:autoAssign(d.data),as=base.concat([{},{},{}]).slice(0,3),H=staff.role==='HRMO';
 const auto=autoAssign(d.data),lvl=levelOf(d.data.school);
 return `<h3>Evaluation (used in Annex C and D)</h3><p class="hint">Level of ${esc(d.data.school||'the school')}: <b>${esc(lvl||'not set')}</b>. Automatic assignment: <b>${auto.length?auto.map(x=>x.area+' · Grades '+x.group+(KS[x.group]||'')).join('; '):'none (set the level in the Schools sheet, or choose below)'}</b>. ${hasOv?'<b>Changed by the school.</b> Press “Use automatic” to go back.':'The boxes below already show the automatic one; change them to override.'}</p><div class="grid">
 <label class="f w2"><span>Interview score</span><input type="text" id="ev_int" value="${esc(ev.interview||'')}"></label><label class="f w2"><span>Performance rating (if any)</span><input type="text" id="ev_perf" value="${esc(ev.perf||'')}"></label><label class="f w2"><span>Other qualifications</span><input type="text" id="ev_oth" value="${esc(ev.others||'')}"></label>
 <label class="f"><span>Remarks</span><input type="text" id="ev_rem" value="${esc(ev.remarks||'')}"></label>
 ${as.map((a,i)=>`<label class="f w3"><span>Assigned learning area ${i+1}</span><select id="ev_a${i}"><option value="">--</option>${AREAS.map(x=>`<option ${a.area===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f w3"><span>Grade group ${i+1}</span><select id="ev_g${i}"><option value="">--</option>${GRP.map(x=>`<option value="${x}" ${a.group===x?'selected':''}>Grades ${x}${KS[x]||''}${x==='3-6'?' (Science only)':''}</option>`).join('')}</select></label>`).join('')}
 ${H?`<label class="f"><span>Fund source (SDO)</span><input type="text" id="ev_fund" value="${esc(ev.fund||setg('DEFAULT_FUND'))}"></label><label class="f w3"><span>Contract: from</span><input type="date" id="ev_cf" value="${esc(ev.cFrom||'')}"></label><label class="f w3"><span>Contract: to</span><input type="date" id="ev_ct" value="${esc(ev.cTo||'')}"></label>`:''}
 </div><div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="b1" data-act="saveeval">Save evaluation</button>${hasOv?'<button class="b2" data-act="useauto">Use automatic key stage</button>':''}</div>`}
function renderStaff(){
 drawNav();
 if(staff===false){$('#app').innerHTML=`<div class="card"><h2>Staff access</h2><p class="sub">School Heads, encoders (AO / selection committee) see their own school only. SDO HRMO sees all schools.</p>
  <div class="grid"><label class="f"><span>Access code</span><input type="text" id="code" autocomplete="off"></label></div>${staffMsg?`<div class="msg err">${esc(staffMsg)}</div>`:''}
  <div class="nav"><button class="b2" data-act="home">Back</button><button class="b1" data-act="login">Log in</button></div></div>`;return}
 if(detail){const d=detail,isR=d.kind==='report',D=d.data;
  const opts=isR?(staff.role==='ENCODER'?[]:['Submitted','Verified','For correction']):statOpts(staff.role);
  const canC=!isR&&D.cat==='tutor'&&contractOK(d.status);
  $('#app').innerHTML=`<div class="card"><button class="b2" data-act="closedetail">← Back to list</button>
  <h2 style="margin-top:12px">${esc(d.ref)} · ${esc(isR?D.name:fullName(D))}</h2><p class="sub">${isR?esc(mLabel(D.month))+' · '+esc(D.school)+' · '+hm(totMin(D)):esc(D.cat==='tutor'?'ARAL Tutor':'ARAL Support Aide')+' · '+esc(D.school)} · Status: <span class="tag">${esc(d.status||(isR?'Submitted':'Received'))}</span></p>
  ${opts.length?`<div class="grid"><label class="f w3"><span>Status</span><select id="stat">${opts.map(s=>`<option ${s===(d.status||opts[0])?'selected':''}>${s}</option>`).join('')}</select></label><label class="f w3"><span>Remarks</span><input type="text" id="rem" value="${esc(d.remarks||'')}"></label></div>`:'<p class="sub">Encoders cannot change the status.</p>'}
  ${staffMsg?`<div class="msg ok">${esc(staffMsg)}</div>`:''}
  <div class="nav" style="justify-content:flex-start;flex-wrap:wrap">${opts.length?'<button class="b1" data-act="setstat">Save status</button>':''}<button class="b3" data-act="sprint">Print forms</button><button class="b2" data-act="sword">Download Word</button>${canC?'<button class="b3" data-act="cprint">Print contract (Annex E)</button><button class="b2" data-act="cword">Contract as Word</button>':''}</div>
  ${!isR?evalPanel(d):''}
  ${(staff.role==='HRMO'||staff.role==='SCHOOLHEAD')?`<h3>Forgot PIN?</h3><div class="grid"><label class="f w3"><span>New PIN for this ${isR?'report':'application'} (4 to 6 digits)</span><input type="text" id="newpin" inputmode="numeric" maxlength="6"></label></div><div class="nav" style="justify-content:flex-start"><button class="b2" data-act="resetpin">Reset PIN</button></div>`:''}</div>
  <div class="card" style="overflow:auto"><div class="doc">${isR?withRef(docF(D)+docG(D),D.ref):docAll(D)}</div></div>`;return}
 const rows=tab==='apps'?list:rlist;const mySig=staff.role==='SCHOOLHEAD'?`<div class="card"><h2>My e-signature</h2><p class="sub">Kept <b>only on this device</b>; it is never saved on the server. It is attached to a monthly report (Annex F and G) only when you press Verify, and that copy is deleted 7 days later. You can also put it on Annex C.</p>${sigBox('School Head e-signature',staff.sig,'sig-my','sigrm-my')}</div>`:'';const TABS=[['apps','Applications'],['reps','Monthly reports'],['reg','Annex C and D'],['need','Tutor need']].concat(staff.role==='HRMO'?[['h','Annex H']]:[]);
 let inner='';
 if(tab==='apps'||tab==='reps'){
  const head=tab==='apps'?'<tr><th>Ref</th><th>Name</th><th>Type</th><th>School</th><th>Date</th><th>Status</th></tr>':'<tr><th>Ref</th><th>Name</th><th>Month</th><th>School</th><th>Hours</th><th>Status</th></tr>';
  const body=rows.map(r=>tab==='apps'?`<tr class="cl" data-act="open" data-ref="${esc(r.ref)}"><td>${esc(r.ref)}</td><td>${esc(r.name)}</td><td>${r.cat==='tutor'?'Tutor':'Support Aide'}</td><td>${esc(r.school)}</td><td>${esc((r.ts||'').slice(0,10))}</td><td><span class="tag">${esc(r.status||'Received')}</span></td></tr>`
   :`<tr class="cl" data-act="openr" data-ref="${esc(r.ref)}"><td>${esc(r.ref)}</td><td>${esc(r.name)}</td><td>${esc(mLabel(r.month))}</td><td>${esc(r.school)}</td><td>${esc(r.hours)}</td><td><span class="tag">${esc(r.status||'Submitted')}</span></td></tr>`).join('');
  inner=`<div style="overflow:auto"><table class="list">${head}${body||'<tr><td colspan="6" style="color:#64748b">Nothing yet.</td></tr>'}</table></div>`}
 else if(tab==='reg'){const cD=regOpt.draftOnly?'':'',ic=regOpt.onlyRec?'checked':'',io=regOpt.official?'checked':'';
  inner=`<p class="sub">Annex C and D appear automatically from the applications of the school${staff.role==='HRMO'?' you choose':''}. The level of the school sets the key stage: Elementary → Key Stage 1 (Grades 1–3), High School → Key Stage 3 (Grades 7–10), Reading and Mathematics.</p>${schPicker('regsch',regData&&regData.school)}
  <div class="chk" style="margin:6px 0"><label><input type="checkbox" id="optC" data-reg ${ic}> Annex C: only recommended / selected</label><label><input type="checkbox" id="optD" data-reg ${io}> Annex D: official only (hide drafts)</label>${staff.role==='SCHOOLHEAD'&&staff.sig?`<label><input type="checkbox" id="useSig" data-reg ${regOpt.sig?'checked':''}> Put my e-signature on Annex C</label>`:''}</div>
  <div class="nav" style="justify-content:flex-start"><button class="b2" data-act="regrefresh">Refresh</button></div>${regLoading?'<div class="msg info">Loading…</div>':''}`}
 else if(tab==='need'){inner=`<p class="sub">Number of ARAL tutors the school needs (DM 061, items 6 to 8). The SDO HRMO uses these in Annex H.</p>${schPicker('needsch')}
  <div class="grid"><label class="f w3"><span>School Year</span><input type="text" id="needsy" value="${esc(setg('SY')||'2026-2027')}"></label><span class="f w3"></span>
  ${NEEDK.map(k=>`<label class="f w2"><span>${k[0]} · ${k[1]}</span><input type="number" min="0" max="999" id="nd_${k[2]}" value="0"></label>`).join('')}</div>
  ${needMsg?`<div class="msg ok">${esc(needMsg)}</div>`:''}<div class="nav" style="justify-content:flex-start"><button class="b2" data-act="needload">Load saved numbers</button><button class="b1" data-act="needsave">Save</button></div>`}
 else if(tab==='h'){inner=`<p class="sub">Combines all schools’ need reports and the engaged tutors (Selected, Approved by SDS, Engaged).</p><div class="nav" style="justify-content:flex-start"><button class="b1" data-act="buildH">Build Annex H</button></div>`}
 const regPrev=tab==='reg'&&regData&&!regLoading?[['C','Annex C',docC({school:regData.school,records:regData.records,onlyRec:regOpt.onlyRec,sig:regOpt.sig?staff.sig:''})],['D','Annex D',docD({school:regData.school,records:regData.records,official:regOpt.official})]].map(x=>`<div class="card"><div class="nav" style="justify-content:flex-start;flex-wrap:wrap;margin-top:0"><b style="align-self:center">${x[1]}</b><button class="b3" data-act="reg${x[0]}print">Print / Save as PDF</button><button class="b2" data-act="reg${x[0]}word">Download Word</button></div></div><div class="card" style="overflow:auto"><div class="doc">${x[2]}</div></div>`).join(''):'';
 const prev=(tab==='h')&&reg?`<div class="card"><div class="nav" style="justify-content:flex-start;flex-wrap:wrap"><button class="b3" data-act="regprint">Print / Save as PDF</button><button class="b2" data-act="regword">Download Word</button>${reg.csv?'<button class="b2" data-act="regcsv">Download CSV</button>':''}</div></div><div class="card" style="overflow:auto"><div class="doc">${reg.html}</div></div>`:'';
 $('#app').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><h2>${TABS.find(t=>t[0]===tab)[1]}</h2><p class="sub">${esc(staff.name||'')} · ${roleName(staff.role)}${staff.role==='HRMO'?'':': '+esc(staff.school)}</p></div><div><button class="b2" data-act="refresh">Refresh</button> <button class="b2" data-act="logout">Log out</button></div></div>
  <div class="tabs" style="flex-wrap:wrap">${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-act="tab-${t[0]}">${t[1]}</button>`).join('')}</div>
  ${staffMsg?`<div class="msg err">${esc(staffMsg)}</div>`:''}${inner}</div>${tab==='apps'||tab==='reg'?mySig:''}${prev}${regPrev}`}
async function loadLists(){const a=await api('list',{code:staff.code});list=a.rows||[];const r=await api('listReports',{code:staff.code});rlist=r.rows||[]}
const schVal=id=>{const e=$('#'+id);return e?e.value.trim():''};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function staffClick(b,a){
 try{
 if(a==='login'){const code=$('#code').value.trim();const r=await api('list',{code});if(!r.ok){staffMsg=r.error||'Invalid code';renderStaff();return}staff={code,role:r.role,name:r.name,school:r.school,sig:''};try{staff.sig=localStorage.getItem('aralHeadSig')||''}catch(e){}list=r.rows;const q=await api('listReports',{code});rlist=q.rows||[];staffMsg='';tab='apps';reg=null;renderStaff()}
else if(a==='logout'){staffKeep=null;staff=false;list=[];rlist=[];detail=null;reg=null;staffMsg='';renderStaff()}
 else if(a==='refresh'){await loadLists();renderStaff()}
 else if(a.startsWith('tab-')){tab=a.slice(4);reg=null;staffMsg='';needMsg='';renderStaff();if(tab==='reg'&&staff.role!=='HRMO'&&!regData)await loadReg()}
 else if(a==='open'){const ref=(b.closest('[data-ref]')||b).dataset.ref;const r=await api('get',{code:staff.code,ref});if(!r.ok){staffMsg=r.error;renderStaff();return}r.data.ref=r.ref;detail=Object.assign(r,{kind:'app'});staffMsg='';renderStaff()}
 else if(a==='openr'){const ref=(b.closest('[data-ref]')||b).dataset.ref;const r=await api('getReport',{code:staff.code,ref});if(!r.ok){staffMsg=r.error;renderStaff();return}r.data.ref=r.ref;r.data.headSig=r.headSig||'';r.data.headSigAt=r.headSigAt||'';detail=Object.assign(r,{kind:'report'});staffMsg='';renderStaff()}
 else if(a==='closedetail'){detail=null;staffMsg='';await loadLists();renderStaff()}
 else if(a==='setstat'){const act=detail.kind==='report'?'verifyReport':'setStatus';const stv=$('#stat').value;const payload={code:staff.code,ref:detail.ref,status:stv,remarks:$('#rem').value};if(detail.kind==='report'&&stv==='Verified'&&staff.role==='SCHOOLHEAD')payload.sig=staff.sig||'';const r=await api(act,payload);if(r.ok){detail.status=stv;detail.remarks=$('#rem').value;if(detail.kind==='report'){const q=await api('getReport',{code:staff.code,ref:detail.ref});if(q.ok){q.data.ref=q.ref;q.data.headSig=q.headSig||'';q.data.headSigAt=q.headSigAt||'';detail=Object.assign(q,{kind:'report'})}}staffMsg=r.signed?'Verified and e-signed.':(detail.kind==='report'&&stv==='Verified'&&staff.role==='SCHOOLHEAD'?'Verified. No e-signature was attached; add yours under “My e-signature” and verify again.':'Status saved.')}else staffMsg=r.error;renderStaff()}
 else if(a==='saveeval'){const g=id=>{const e=$('#'+id);return e?e.value.trim():''};const assign=[0,1,2].map(i=>({area:g('ev_a'+i),group:g('ev_g'+i)})).filter(x=>x.area&&x.group);
  const bad=assign.find(x=>x.area==='Science'?(x.group!=='3-6'&&x.group!=='7-10'):x.group==='3-6');if(bad){staffMsg='Check the grade group: Science uses Grades 3-6 or 7-10; Reading and Mathematics use 1-3, 4-6 or 7-10.';renderStaff();return}
  const key=a=>a.map(x=>x.area+'|'+x.group).sort().join(';');const sameAuto=key(assign)===key(autoAssign(detail.data));
  const ev={interview:g('ev_int'),perf:g('ev_perf'),others:g('ev_oth'),remarks:g('ev_rem'),assign:sameAuto?[]:assign};if($('#ev_fund')){ev.fund=g('ev_fund');ev.cFrom=g('ev_cf');ev.cTo=g('ev_ct')}
  const r=await api('saveEval',{code:staff.code,ref:detail.ref,ev});if(r.ok){detail.eval=r.eval;staffMsg='Evaluation saved.'}else staffMsg=r.error;renderStaff()}
 else if(a==='useauto'){const ev={interview:($('#ev_int')||{}).value||'',perf:($('#ev_perf')||{}).value||'',others:($('#ev_oth')||{}).value||'',remarks:($('#ev_rem')||{}).value||'',assign:[]};if($('#ev_fund')){ev.fund=$('#ev_fund').value;ev.cFrom=$('#ev_cf').value;ev.cTo=$('#ev_ct').value}const r=await api('saveEval',{code:staff.code,ref:detail.ref,ev});if(r.ok){detail.eval=r.eval;staffMsg='Back to the automatic key stage.'}else staffMsg=r.error;renderStaff()}
 else if(a==='sprint')doPrint(detail.kind==='report'?docR(detail.data):docAll(detail.data));
 else if(a==='sword'){if(detail.kind==='report')doWordR(docR(detail.data),'ARAL_AnnexF_G_'+(detail.data.name||'report'));else doWord(docAll(detail.data),'ARAL_'+(detail.data.last||'applicant'))}
 else if(a==='resetpin'){const np=($('#newpin')||{}).value||'';const r=await api('resetPin',{code:staff.code,kind:detail.kind==='report'?'report':'app',ref:detail.ref,pin:np.trim()});staffMsg=r.ok?'PIN reset. Give the new PIN to the applicant.':r.error;renderStaff()}
 else if(a==='cprint')doPrint(docE(detail.data,detail.eval));
 else if(a==='cword')doWordR(docE(detail.data,detail.eval),'ARAL_Contract_'+(detail.data.last||'tutor'));
 else if(a==='regrefresh')await loadReg();
 else if(a==='regCprint')doPrint(docC({school:regData.school,records:regData.records,onlyRec:regOpt.onlyRec,sig:regOpt.sig?staff.sig:''}));
 else if(a==='regCword')doWordR(docC({school:regData.school,records:regData.records,onlyRec:regOpt.onlyRec,sig:regOpt.sig?staff.sig:''}),'AnnexC_'+regData.school);
 else if(a==='regDprint')doPrint(docD({school:regData.school,records:regData.records,official:regOpt.official}));
 else if(a==='regDword')doWordR(docD({school:regData.school,records:regData.records,official:regOpt.official}),'AnnexD_'+regData.school);
 else if(a==='needload'||a==='needsave'){const sc=schVal('needsch');if(!sc){needMsg='';staffMsg='Choose a school first.';renderStaff();return}staffMsg='';
  if(a==='needload'){const r=await api('registry',{code:staff.code,school:sc});const sy=schVal('needsy');const n=(r.needs||[]).find(x=>x.sy===sy)||(r.needs||[])[0];NEEDK.forEach(k=>{const e=$('#nd_'+k[2]);if(e)e.value=n&&n.counts?(n.counts[k[2]]||0):0});needMsg=n?'Loaded.':'No saved numbers yet.';const m=$('.msg.ok');if(m)m.textContent=needMsg;else{const d=document.createElement('div');d.className='msg ok';d.textContent=needMsg;$('.nav').before(d)}}
  else{const counts={};NEEDK.forEach(k=>counts[k[2]]=parseInt(($('#nd_'+k[2])||{}).value,10)||0);const r=await api('saveNeed',{code:staff.code,school:sc,sy:schVal('needsy'),counts});if(r.ok){toast('Saved')}else{staffMsg=r.error;renderStaff()}}}
 else if(a==='buildH'){const r=await api('registry',{code:staff.code,school:''});if(!r.ok){staffMsg=r.error;renderStaff();return}staffMsg='';const rep={records:r.records,needs:r.needs};reg={html:docH(rep),title:'AnnexH_SDO_Consolidated',csv:csvH(rep)};renderStaff()}
 else if(a==='regprint')doPrint(reg.html);
 else if(a==='regword')doWordR(reg.html,reg.title);
 else if(a==='regcsv')dl(reg.title+'.csv',reg.csv,'text/csv');
 }catch(err){staffMsg=err.message;renderStaff()}}
document.addEventListener('change',e=>{const t=e.target;if(!t||!staff||typeof staff!=='object')return;if(t.id==='regsch')loadReg();else if(t.dataset&&t.dataset.reg!==undefined){regOpt={onlyRec:!!($('#optC')||{}).checked,official:!!($('#optD')||{}).checked,sig:!!($('#useSig')||{}).checked};renderStaff()}});
document.addEventListener('click',e=>{const tr=e.target.closest('tr[data-act]');if(tr&&!e.target.closest('button')){staffClick(tr,tr.dataset.act)}});
render();loadConfig();
</script>
